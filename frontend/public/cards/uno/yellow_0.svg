<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  
    <defs>
      <linearGradient id="red-grad-yellow_0" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF3B5C"/>
        <stop offset="100%" stop-color="#C4001E"/>
      </linearGradient>
      <linearGradient id="green-grad-yellow_0" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981"/>
        <stop offset="100%" stop-color="#046C4E"/>
      </linearGradient>
      <linearGradient id="blue-grad-yellow_0" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#1E40AF"/>
      </linearGradient>
      <linearGradient id="yellow-grad-yellow_0" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FBBF24"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
      <linearGradient id="wild-grad-yellow_0" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E2640"/>
        <stop offset="100%" stop-color="#110E1C"/>
      </linearGradient>
      <linearGradient id="oval-grad-yellow_0" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F3F4F6"/>
      </linearGradient>
      <linearGradient id="gold-grad-yellow_0" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE259"/>
        <stop offset="100%" stop-color="#FFA751"/>
      </linearGradient>
      <filter id="card-shadow-yellow_0" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <filter id="oval-shadow-yellow_0" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
      </filter>
      <filter id="text-shadow-yellow_0" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
      </filter>
    </defs>
  
  
    <!-- Outer Card Shadow & Base -->
    <rect x="6" y="6" width="228" height="348" rx="22" ry="22" fill="url(#yellow-grad-yellow_0)" stroke="#FFFFFF" stroke-width="5" filter="url(#card-shadow-yellow_0)"/>
    <!-- Inner Border Line -->
    <rect x="14" y="14" width="212" height="332" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  
  
    <!-- Central Tilted White Oval -->
    <ellipse cx="120" cy="180" rx="76" ry="112" transform="rotate(-25 120 180)" fill="url(#oval-grad-yellow_0)" stroke="#FFFFFF" stroke-width="3" filter="url(#oval-shadow-yellow_0)"/>
  
  
    <g transform="translate(120, 180) rotate(-10)">
      <text x="0" y="10" text-anchor="middle" dominant-baseline="central" font-size="110" font-weight="900" font-family="'Arial Black', sans-serif" fill="#D97706" filter="url(#text-shadow-yellow_0)">0</text>
      
    </g>
  
  
    <!-- Top-Left Index -->
    <g transform="translate(28, 46)">
      
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="36" font-weight="900" font-family="'Arial Black', sans-serif" fill="#FFFFFF" filter="url(#text-shadow-yellow_0)">0</text>
    
  
    </g>
    <!-- Bottom-Right Index (Rotated 180) -->
    <g transform="translate(212, 314) rotate(180)">
      
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="36" font-weight="900" font-family="'Arial Black', sans-serif" fill="#FFFFFF" filter="url(#text-shadow-yellow_0)">0</text>
    
  
    </g>
  
</svg>