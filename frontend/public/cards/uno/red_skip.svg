<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  
    <defs>
      <linearGradient id="red-grad-red_skip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF3B5C"/>
        <stop offset="100%" stop-color="#C4001E"/>
      </linearGradient>
      <linearGradient id="green-grad-red_skip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981"/>
        <stop offset="100%" stop-color="#046C4E"/>
      </linearGradient>
      <linearGradient id="blue-grad-red_skip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#1E40AF"/>
      </linearGradient>
      <linearGradient id="yellow-grad-red_skip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FBBF24"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
      <linearGradient id="wild-grad-red_skip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E2640"/>
        <stop offset="100%" stop-color="#110E1C"/>
      </linearGradient>
      <linearGradient id="oval-grad-red_skip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F3F4F6"/>
      </linearGradient>
      <linearGradient id="gold-grad-red_skip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE259"/>
        <stop offset="100%" stop-color="#FFA751"/>
      </linearGradient>
      <filter id="card-shadow-red_skip" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <filter id="oval-shadow-red_skip" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
      </filter>
      <filter id="text-shadow-red_skip" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
      </filter>
    </defs>
  
  
    <!-- Outer Card Shadow & Base -->
    <rect x="6" y="6" width="228" height="348" rx="22" ry="22" fill="url(#red-grad-red_skip)" stroke="#FFFFFF" stroke-width="5" filter="url(#card-shadow-red_skip)"/>
    <!-- Inner Border Line -->
    <rect x="14" y="14" width="212" height="332" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  
  
    <!-- Central Tilted White Oval -->
    <ellipse cx="120" cy="180" rx="76" ry="112" transform="rotate(-25 120 180)" fill="url(#oval-grad-red_skip)" stroke="#FFFFFF" stroke-width="3" filter="url(#oval-shadow-red_skip)"/>
  
  
    <g transform="translate(120, 180) rotate(-10)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#D3001E" stroke-width="15" filter="url(#text-shadow-red_skip)"/>
      <line x1="-32" y1="32" x2="32" y2="-32" stroke="#D3001E" stroke-width="15" stroke-linecap="round" filter="url(#text-shadow-red_skip)"/>
    </g>
  
  
    <!-- Top-Left Index -->
    <g transform="translate(28, 46)">
      
    <g transform="scale(0.75)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <line x1="-14" y1="14" x2="14" y2="-14" stroke="#FFFFFF" stroke-width="7"/>
    </g>
  
    </g>
    <!-- Bottom-Right Index (Rotated 180) -->
    <g transform="translate(212, 314) rotate(180)">
      
    <g transform="scale(0.75)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <line x1="-14" y1="14" x2="14" y2="-14" stroke="#FFFFFF" stroke-width="7"/>
    </g>
  
    </g>
  
</svg>