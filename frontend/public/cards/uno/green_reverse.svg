<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  
    <defs>
      <linearGradient id="red-grad-green_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF3B5C"/>
        <stop offset="100%" stop-color="#C4001E"/>
      </linearGradient>
      <linearGradient id="green-grad-green_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981"/>
        <stop offset="100%" stop-color="#046C4E"/>
      </linearGradient>
      <linearGradient id="blue-grad-green_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#1E40AF"/>
      </linearGradient>
      <linearGradient id="yellow-grad-green_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FBBF24"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
      <linearGradient id="wild-grad-green_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E2640"/>
        <stop offset="100%" stop-color="#110E1C"/>
      </linearGradient>
      <linearGradient id="oval-grad-green_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F3F4F6"/>
      </linearGradient>
      <linearGradient id="gold-grad-green_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE259"/>
        <stop offset="100%" stop-color="#FFA751"/>
      </linearGradient>
      <filter id="card-shadow-green_reverse" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <filter id="oval-shadow-green_reverse" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
      </filter>
      <filter id="text-shadow-green_reverse" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
      </filter>
    </defs>
  
  
    <!-- Outer Card Shadow & Base -->
    <rect x="6" y="6" width="228" height="348" rx="22" ry="22" fill="url(#green-grad-green_reverse)" stroke="#FFFFFF" stroke-width="5" filter="url(#card-shadow-green_reverse)"/>
    <!-- Inner Border Line -->
    <rect x="14" y="14" width="212" height="332" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  
  
    <!-- Central Tilted White/Colored Oval -->
    <ellipse cx="120" cy="180" rx="76" ry="112" transform="rotate(-25 120 180)" fill="url(#oval-grad-green_reverse)" stroke="#FFFFFF" stroke-width="3" filter="url(#oval-shadow-green_reverse)"/>
  
  
    <g transform="translate(120, 180) rotate(-10)">
      <g filter="url(#text-shadow-green_reverse)">
        <path d="M -36 -20 A 36 36 0 0 1 36 -20 L 20 -42 M 36 -20 L 20 2" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M 36 20 A 36 36 0 0 1 -36 20 L -20 42 M -36 20 L -20 -2" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  
  
    <!-- Top-Left Index -->
    <g transform="translate(28, 46)">
      
    <g transform="scale(0.75)">
      <path d="M -18 -10 A 18 18 0 0 1 18 -10 L 10 -22 M 18 -10 L 10 2" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 18 10 A 18 18 0 0 1 -18 10 L -10 22 M -18 10 L -10 -2" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  
    </g>
    <!-- Bottom-Right Index (Rotated 180) -->
    <g transform="translate(212, 314) rotate(180)">
      
    <g transform="scale(0.75)">
      <path d="M -18 -10 A 18 18 0 0 1 18 -10 L 10 -22 M 18 -10 L 10 2" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 18 10 A 18 18 0 0 1 -18 10 L -10 22 M -18 10 L -10 -2" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  
    </g>
  
</svg>